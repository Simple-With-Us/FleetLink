name: ci

on:
  push:
  pull_request:

jobs:
  ios-build:
    runs-on: macos-latest
    timeout-minutes: 40
    steps:
      - uses: actions/checkout@v4
      - name: Install XcodeGen
        run: brew install xcodegen
      - name: Generate the Xcode project
        working-directory: ios
        run: xcodegen generate
      - name: Build FleetLink for the iOS Simulator without signing
        working-directory: ios
        run: |
          xcodebuild \
            -project FleetLink.xcodeproj \
            -scheme FleetLink \
            -destination 'generic/platform=iOS Simulator' \
            -configuration Debug \
            CODE_SIGNING_ALLOWED=NO \
            CODE_SIGNING_REQUIRED=NO \
            CODE_SIGN_IDENTITY=- \
            build
  # The TestFlight ship itself only runs on main (ios-testflight.yml), so its
  # decision logic is checked here on every PR instead of first running there.
  ios-ship-logic:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
      - name: Fleet ship tooling matches its sha256 pin
        run: bash scripts/ios-fleet-pin.sh --check
      - name: Ship scripts parse
        run: |
          for f in scripts/ios-ship-testflight.sh scripts/ios-install-appstore-profiles.sh \
                   scripts/ios-prepare-signing.sh scripts/ios-scheduled-ship-gate.sh \
                   scripts/ios-fleet-pin.sh scripts/ios-fleet/ship-testflight.sh; do
            bash -n "$f"
          done
      - name: Scheduled ship gate decisions
        run: bash scripts/test-ios-scheduled-ship-gate.sh
      # The App Store Connect credential rules (AFC-459):  the key comes from
      # the environment or from Infisical, and a named ASC_KEY_PATH is ignored.
      - name: App Store Connect credential rules
        run: node --test scripts/ios-fleet/*.test.mjs
      - name: App Store Connect credential precedence
        run: bash scripts/ios-fleet/test-asc-credentials.sh
  test:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
      - run: npm ci
      - run: npm test
      - run: node scripts/bundle-worker.mjs
  e2e:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
      - run: npm ci
      - run: npx playwright install --with-deps chromium
      - run: npm run e2e
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: e2e-screenshots
          path: e2e/screenshots
