name: CI

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]

jobs:
  test-worker:
    name: Worker Tests
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-node@v7
        with:
          node-version: 24
          cache: npm
      - run: npm ci
      - run: npm run check
      - run: npm test

  build-ios:
    name: iOS App & App Clip Build
    runs-on: macos-26
    steps:
      - uses: actions/checkout@v7
      - name: Install XcodeGen
        run: brew install xcodegen
      - name: Select Xcode 15.4
        run: |
          if [ -d "/Applications/Xcode_15.4.app" ]; then
            sudo xcode-select -s /Applications/Xcode_15.4.app
          fi
          xcodebuild -version
      - name: Boot iOS Simulator
        run: |
          SIM_ID=$(xcrun simctl list devices available | grep -m1 "iPhone" | awk -F '[()]' '{print $2}')
          echo "Booting simulator: $SIM_ID"
          xcrun simctl boot "$SIM_ID" || true
          echo "SIM_ID=$SIM_ID" >> $GITHUB_ENV
      - name: Generate Xcode Project
        run: |
          cd ios
          xcodegen generate
          sed -i '' 's/objectVersion = 77;/objectVersion = 56;/g' FleetLink.xcodeproj/project.pbxproj
          sed -i '' 's/preferredProjectObjectVersion = 77;/preferredProjectObjectVersion = 56;/g' FleetLink.xcodeproj/project.pbxproj
      - name: Set up code signing keychain
        if: ${{ env.BUILD_CERTIFICATE_BASE64 != '' }}
        env:
          BUILD_CERTIFICATE_BASE64: ${{ secrets.BUILD_CERTIFICATE_BASE64 }}
          P12_PASSWORD: ${{ secrets.P12_PASSWORD }}
          KEYCHAIN_PASSWORD: ${{ secrets.KEYCHAIN_PASSWORD || 'temporary-ci-password' }}
        run: |
          KEYCHAIN_PATH=$RUNNER_TEMP/build.keychain-db
          security create-keychain -p "$KEYCHAIN_PASSWORD" $KEYCHAIN_PATH
          security set-keychain-settings -lut 21600 $KEYCHAIN_PATH
          security unlock-keychain -p "$KEYCHAIN_PASSWORD" $KEYCHAIN_PATH
          echo "$BUILD_CERTIFICATE_BASE64" | base64 --decode -o $RUNNER_TEMP/certificate.p12
          security import $RUNNER_TEMP/certificate.p12 -P "$P12_PASSWORD" -A -t cert -f pkcs12 -k $KEYCHAIN_PATH
          security list-keychain -d user -s $KEYCHAIN_PATH
      - name: Build App Clip
        run: |
          xcodebuild -project ios/FleetLink.xcodeproj \
                     -scheme FleetLinkClip \
                     -destination "id=$SIM_ID" \
                     -derivedDataPath ios/build \
                     CODE_SIGNING_ALLOWED=NO \
                     build
      - name: Build Main App
        run: |
          xcodebuild -project ios/FleetLink.xcodeproj \
                     -scheme FleetLink \
                     -destination "id=$SIM_ID" \
                     -derivedDataPath ios/build \
                     CODE_SIGNING_ALLOWED=NO \
                     build
      - name: Capture Simulator Screenshots
        run: |
          mkdir -p ./screenshots
          CLIP_PATH=$(find ios/build/Build/Products -name "FleetLinkClip.app" -type d | head -n1)
          APP_PATH=$(find ios/build/Build/Products -name "FleetLink.app" -type d | head -n1)
          
          if [ -n "$APP_PATH" ]; then
            echo "Installing and launching Main App..."
            xcrun simctl install "$SIM_ID" "$APP_PATH"
            xcrun simctl launch "$SIM_ID" online.fleetlink.ios || true
            sleep 3
            xcrun simctl io "$SIM_ID" screenshot ./screenshots/app.png || true
          fi
          
          if [ -n "$CLIP_PATH" ]; then
            echo "Installing and launching App Clip..."
            xcrun simctl install "$SIM_ID" "$CLIP_PATH"
            xcrun simctl launch "$SIM_ID" online.fleetlink.ios.Clip || true
            sleep 3
            xcrun simctl io "$SIM_ID" screenshot ./screenshots/appclip.png || true
          fi
      - name: Upload Simulator Screenshots
        uses: actions/upload-artifact@v7
        if: always()
        with:
          name: ios-screenshots
          path: ./screenshots/*.png
          if-no-files-found: ignore
