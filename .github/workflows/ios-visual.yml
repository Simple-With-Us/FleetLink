name: iOS management visual fixtures
on:
  pull_request:
    paths:
      - 'ios/**'
      - '.github/workflows/ios-visual.yml'
      - 'scripts/ios-visual-fixtures.sh'
permissions:
  contents: read
jobs:
  screenshots:
    runs-on: macos-latest
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@v4
      - run: brew install xcodegen
      - name: Render actual management sheets in a disposable simulator
        run: bash scripts/ios-visual-fixtures.sh
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: ios-management-fixtures
          path: /tmp/fleetlink-visual/screenshots/*.png
