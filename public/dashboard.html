<!DOCTYPE html>
<html>
<head>
  <title>FleetLink Dashboard</title>
  <style>
    body { font-family: system-ui; margin: 2rem; }
    .panel { border: 1px solid #ccc; padding: 1rem; margin: 1rem 0; }
    button { margin: 0.5rem; }
  </style>
</head>
<body>
  <h1>FleetLink Dashboard</h1>
  <div class="panel" id="account">Account panel</div>
  <div class="panel" id="passkeys">
    <h2>Passkeys</h2>
    <ul id="passkey-list"></ul>
    <button id="add-passkey">Add Passkey</button>
  </div>
  <div class="panel" id="tokens">Agent Tokens (create your own)</div>
  <div class="panel" id="teams">Teams</div>
  <script>
    // Wire to /api/auth/passkey/* and /api/user/passkeys
    document.getElementById('add-passkey').onclick = async () => {
      const res = await fetch('/api/auth/passkey/register/options', { method: 'POST' });
      const { options } = await res.json();
      // const attestation = await navigator.credentials.create({ publicKey: options });
      // then POST to /verify
      alert('Passkey registration flow (wire to SimpleWebAuthn browser)');
    };
  </script>
</body>
</html>
