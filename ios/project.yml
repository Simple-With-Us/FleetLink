name: FleetLink
options:
  bundleIdPrefix: online.fleetlink
  xcodeVersion: '15.4'
  deploymentTarget:
    iOS: '17.0'
  createIntermediateGroups: true
  groupSortPosition: top
settings:
  base:
    SWIFT_VERSION: '5.9'
    IPHONEOS_DEPLOYMENT_TARGET: '17.0'
    CODE_SIGN_STYLE: Automatic
    DEVELOPMENT_TEAM: CC8UTF7ATG
    ASSETCATALOG_FILTER_FOR_THINNING: false
    ENABLE_ASSET_THINNING: false
targets:
  FleetLinkClip:
    type: application.on-demand-install-capable
    platform: iOS
    sources:
      - path: Clip
      - path: Shared
      - path: Assets.xcassets
    settings:
      base:
        PRODUCT_BUNDLE_IDENTIFIER: online.fleetlink.Clip
        DEVELOPMENT_TEAM: CC8UTF7ATG
        CODE_SIGN_STYLE: Automatic
        MARKETING_VERSION: "1.0.0"
        CURRENT_PROJECT_VERSION: "1"
        SWIFT_VERSION: '5.9'
        TARGETED_DEVICE_FAMILY: '1,2'
        CODE_SIGN_ENTITLEMENTS: Clip/FleetLinkClip.entitlements
        ASSETCATALOG_COMPILER_APPICON_NAME: AppIcon
    info:
      path: Clip/Info.plist

  FleetLink:
    type: application
    platform: iOS
    sources:
      - path: App
      - path: Shared
      - path: Assets.xcassets
    dependencies:
      - target: FleetLinkClip
    settings:
      base:
        PRODUCT_BUNDLE_IDENTIFIER: online.fleetlink
        DEVELOPMENT_TEAM: CC8UTF7ATG
        CODE_SIGN_STYLE: Automatic
        MARKETING_VERSION: "1.0.0"
        CURRENT_PROJECT_VERSION: "1"
        SWIFT_VERSION: '5.9'
        TARGETED_DEVICE_FAMILY: '1,2'
        CODE_SIGN_ENTITLEMENTS: App/FleetLink.entitlements
        ASSETCATALOG_COMPILER_APPICON_NAME: AppIcon
    info:
      path: App/Info.plist

schemes:
  FleetLink:
    build:
      targets:
        FleetLink: all
        FleetLinkClip: all
    run:
      config: Debug
    archive:
      config: Release
  FleetLinkClip:
    build:
      targets:
        FleetLinkClip: all
    run:
      config: Debug
    archive:
      config: Release
