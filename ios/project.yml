# MARKETING_VERSION and CURRENT_PROJECT_VERSION below are placeholders for local
# builds.  A TestFlight ship overrides both on the xcodebuild command line:
# scripts/ios-fleet/ship-testflight.sh reads the highest 1.0.N on App Store
# Connect, ships 1.0.(N+1) with a UTC YYYYMMDDHHMM build number, and applies the
# same pair to the app and the App Clip.  Do not bump them by hand to ship.
name: FleetLink
options:
  bundleIdPrefix: online.fleetlink.ios
  xcodeVersion: '15.4'
  deploymentTarget:
    iOS: '17.0'
  createIntermediateGroups: true
  groupSortPosition: top
settings:
  base:
    SWIFT_VERSION: '5.9'
    IPHONEOS_DEPLOYMENT_TARGET: '17.0'
    DEVELOPMENT_TEAM: CC8UTF7ATG
    ASSETCATALOG_FILTER_FOR_THINNING: false
    ENABLE_ASSET_THINNING: false
packages:
  sentry-cocoa:
    url: https://github.com/getsentry/sentry-cocoa
    from: 9.30.1
targets:
  FleetLinkClip:
    type: application.on-demand-install-capable
    platform: iOS
    sources:
      - path: Clip
      - path: Shared
      - path: Assets.xcassets
    dependencies:
      - package: sentry-cocoa
        product: Sentry
    settings:
      base:
        PRODUCT_BUNDLE_IDENTIFIER: online.fleetlink.ios.Clip
        DEVELOPMENT_TEAM: CC8UTF7ATG
        MARKETING_VERSION: "1.0.110"
        CURRENT_PROJECT_VERSION: "110"  # commit count; ship script overrides per build
        SWIFT_VERSION: '5.9'
        TARGETED_DEVICE_FAMILY: '1,2'
        CODE_SIGN_ENTITLEMENTS: Clip/FleetLinkClip.entitlements
        ASSETCATALOG_COMPILER_APPICON_NAME: AppIcon
        CODE_SIGN_STYLE: Automatic
      configs:
        Release:
          CODE_SIGN_STYLE: Manual
          CODE_SIGN_IDENTITY: Apple Distribution
          PROVISIONING_PROFILE_SPECIFIER: "FleetLink iOS Clip App Store"
    info:
      path: Clip/Info.plist
      properties:
        CFBundleDisplayName: FleetLink Clip
        CFBundleVersion: $(CURRENT_PROJECT_VERSION)
        CFBundleShortVersionString: $(MARKETING_VERSION)
        CFBundlePackageType: APPL
        ITSAppUsesNonExemptEncryption: false
        SentryDSN: $(SENTRY_DSN)
        UILaunchScreen: {}
        NSAppClip:
          NSAppClipRequestEphemeralUserNotification: false
          NSAppClipRequestLocationConfirmation: false
        UISupportedInterfaceOrientations:
          - UIInterfaceOrientationPortrait
          - UIInterfaceOrientationPortraitUpsideDown
          - UIInterfaceOrientationLandscapeLeft
          - UIInterfaceOrientationLandscapeRight
        UISupportedInterfaceOrientations~ipad:
          - UIInterfaceOrientationPortrait
          - UIInterfaceOrientationPortraitUpsideDown
          - UIInterfaceOrientationLandscapeLeft
          - UIInterfaceOrientationLandscapeRight

  FleetLink:
    type: application
    platform: iOS
    sources:
      - path: App
      - path: Shared
      - path: Assets.xcassets
    dependencies:
      - target: FleetLinkClip
        embed: true
      - package: sentry-cocoa
        product: Sentry
    entitlements:
      path: App/FleetLink.entitlements
      properties:
        com.apple.developer.associated-domains:
          - applinks:fleetlink.online
          - applinks:fleetlink.app
          - webcredentials:fleetlink.online
          - webcredentials:fleetlink.app
    settings:
      base:
        PRODUCT_BUNDLE_IDENTIFIER: online.fleetlink.ios
        DEVELOPMENT_TEAM: CC8UTF7ATG
        MARKETING_VERSION: "1.0.110"
        CURRENT_PROJECT_VERSION: "110"  # commit count; ship script overrides per build
        SWIFT_VERSION: '5.9'
        TARGETED_DEVICE_FAMILY: '1,2'
        CODE_SIGN_ENTITLEMENTS: App/FleetLink.entitlements
        ASSETCATALOG_COMPILER_APPICON_NAME: AppIcon
        CODE_SIGN_STYLE: Automatic
      configs:
        Release:
          CODE_SIGN_STYLE: Manual
          CODE_SIGN_IDENTITY: Apple Distribution
          PROVISIONING_PROFILE_SPECIFIER: "FleetLink iOS App Store"
    info:
      path: App/Info.plist
      properties:
        CFBundleDisplayName: FleetLink
        CFBundleVersion: $(CURRENT_PROJECT_VERSION)
        CFBundleShortVersionString: $(MARKETING_VERSION)
        ITSAppUsesNonExemptEncryption: false
        SentryDSN: $(SENTRY_DSN)
        FleetLinkAccountOrigin: https://fleetlink.online
        UILaunchScreen: {}
        UISupportedInterfaceOrientations:
          - UIInterfaceOrientationPortrait
          - UIInterfaceOrientationLandscapeLeft
          - UIInterfaceOrientationLandscapeRight
        UISupportedInterfaceOrientations~ipad:
          - UIInterfaceOrientationPortrait
          - UIInterfaceOrientationPortraitUpsideDown
          - UIInterfaceOrientationLandscapeLeft
          - UIInterfaceOrientationLandscapeRight

schemes:
  FleetLink:
    build:
      targets:
        FleetLink: all
        FleetLinkClip: all
    run:
      config: Debug
    archive:
      config: Release
  FleetLinkClip:
    build:
      targets:
        FleetLinkClip: all
    run:
      config: Debug
    archive:
      config: Release
